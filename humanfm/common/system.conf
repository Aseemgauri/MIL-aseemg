# =============================================================================
# SYSTEM-WIDE CONFIGURATION FILE
# This file contains all configuration settings used across the entire system.
# Format: KEY=VALUE (no spaces around =)
# Lines starting with # are comments
# =============================================================================

# =============================================================================
# GLOBAL AUDIO & PROCESSING SETTINGS
# =============================================================================

# Audio processing sample rate (Hz)
SYSTEM_SAMPLE_RATE=16000

# Machine Learning Configuration
SYSTEM_NUM_CLASSES=5
SYSTEM_CLASS_NAMES=Baby cry,Cat,Rooster,Cricket,Dog

# =============================================================================
# NETWORK & STREAMING SETTINGS
# =============================================================================

# Streaming method: multicast, broadcast, unicast
SYSTEM_STREAMING_MODE=unicast

# Network addresses
SYSTEM_MULTICAST_ADDRESS=239.1.1.1
SYSTEM_UDP_STREAMING_PORT=5000
SYSTEM_NODE_SERVER_PORT=8000

# Device IP addresses
SYSTEM_ORANGEPI_IP=100.82.70.55
SYSTEM_LAPTOP_IP=100.121.151.92

# =============================================================================
# GST CLIENT SPECIFIC SETTINGS
# =============================================================================

# Audio input mode: live, file
GST_AUDIO_MODE=live

# File audio settings (when GST_AUDIO_MODE=file)
GST_AUDIO_FILE_DIRECTORY=/home/orangepi/Documents/CSE_492R_2025-HumanFM/audio/
GST_DEFAULT_AUDIO_FILE=dog_16k.wav

# Audio processing compensation
GST_VOLUME_COMPENSATION=4.0
GST_AMPLIFY_COMPENSATION=16.0

# Audio backend: auto, jack, pulse, alsa
GST_AUDIO_BACKEND=jack

# ALSA device specification (only used if GST_AUDIO_BACKEND=alsa)
GST_ALSA_DEVICE=hw:0,0

# GST JACK client name for audio streaming
# Name used to identify the GST client in the JACK audio system
# Used by: GST Client (JACK audio connection and port management)
# Should be unique among all JACK clients on the system
GST_JACK_CLIENT_NAME=gst_audio_client

# Broadcast IP address for broadcast streaming mode
# IP address used when SYSTEM_STREAMING_MODE=broadcast
# Used by: GST Client (broadcast audio streaming)
# Standard broadcast address: 255.255.255.255 (sends to all devices on network)
GST_BROADCAST_ADDRESS=255.255.255.255

# =============================================================================
# PYTHON SERVER SPECIFIC SETTINGS
# =============================================================================

# Demo mode configuration
PYTHON_DEMO_MODE=false
PYTHON_DEMO_CLASS=Dog

# ML inference thresholds
PYTHON_CLASS_THRESHOLD=0.1
PYTHON_CONFIDENCE_THRESHOLD=0.1

# Server configuration
PYTHON_BUFFER_SIZE=1024
PYTHON_MAX_CONNECTIONS=10

# =============================================================================
# NODE SERVER SPECIFIC SETTINGS
# =============================================================================

# Data management (times in seconds/milliseconds as indicated)
NODE_DATA_EXPIRY_TIME_SECONDS=500
NODE_MINIMUM_ACTIVATION_TIME_MS=1000

# Detection threshold for classification scores (0.0 to 1.0)
NODE_DETECTION_THRESHOLD=0.1

# Server limits
NODE_MAX_EVENTS_PER_CLASS=100
NODE_MAX_TOTAL_EVENTS=500

# Database configuration
NODE_DATABASE_FILE=humanfm.db
NODE_DEFAULT_CLASS_LEVEL=50.0

# =============================================================================
# SEMANTIC LISTENING CLIENT SPECIFIC SETTINGS
# =============================================================================

# Jack configuration
SL_JACK_CLIENT_NAME=SH-audio-RT

# Audio processing
SL_GAIN_COMPENSATION_FACTOR=8.0

# Feature flags for testing/debugging (true/false)
SL_ENABLE_PASSTHROUGH=false
SL_ENABLE_INFERENCE=true
SL_FILL_EMBEDDING=false

# Jack port configuration
SL_MAX_JACK_BUFFER_SIZE=4096
SL_INPUT_PORTS=2
SL_OUTPUT_PORTS=2

# Unix domain socket path for client-server communication
SOCKET_PATH=/tmp/humanfm.sock 